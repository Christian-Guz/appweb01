{% extends "layout.html" %}

{%block content%}
<div class="container-fluid">
    <h1>Productos</h1>
    <p>Hola {{mensaje}}</p>
    <p>Aquí podrás encontrar nuestros productos</p>
</div>

<div id="carouselExampleControls"
    class="carousel slide mi-carrusel"
    data-ride="carousel">
<div class="carousel-inner">

<div class="carousel-item active">
    <img src="{{ url_for('static', filename='img/productos/pan_de_muerto.jpg') }}"
    class="d-block w-100"
    alt="Pan_de_muerto">
</div>

<div class="carousel-item">
    <img src="{{ url_for('static', filename='img/productos/taza_dia_de_muertos.jpg') }}"
    class="d-block w-100"
    alt="Taza">
</div>

<div class="carousel-item">
    <img src="{{ url_for('static', filename='img/productos/alfeñiques.jpg') }}"
    class="d-block w-100"
    alt="Alfeñiques">
</div>

</div>

<a class="carousel-control-prev"
href="#carouselExampleControls"
role="button"
data-slide="prev">
<span class="carousel-control-prev-icon"
aria-hidden="true"></span>
</a>

<a class="carousel-control-next"
href="#carouselExampleControls"
role="button"
data-slide="next">

<span class="carousel-control-next-icon"
aria-hidden="true"></span>
</a>

</div>

{%endblock%}
